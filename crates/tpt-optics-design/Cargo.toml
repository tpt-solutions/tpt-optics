[package]
name = "tpt-optics-design"
description = "Optical design for tpt-optics: merit functions, damped least-squares / simulated annealing / genetic optimizers, Monte-Carlo tolerance analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["lens-design", "optimization", "tolerancing", "zernike", "optics"]
categories = ["science", "simulation", "mathematics", "no-std"]
readme = "README.md"

[features]
default = []
# Parallel Monte-Carlo tolerance analysis on the rayon thread pool.
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
tpt-optics-core = { workspace = true }
tpt-optics-geometric = { workspace = true }
libm = { workspace = true }

[lints]
workspace = true
