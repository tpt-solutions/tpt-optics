[package]
name = "tpt-optics-geometric"
description = "Geometric optics for tpt-optics: sequential and non-sequential ray tracing, spherical/aspheric/Zernike/diffractive surfaces, ABCD matrices, paraxial optics and differentiable tracing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["ray-tracing", "optics", "lens-design", "abcd-matrix", "optical-design"]
categories = ["science", "simulation", "no-std"]
readme = "README.md"

[features]
default = []
# Reserved: std-only extras keep the crate no_std + alloc by default.
std = []

[dependencies]
tpt-optics-core = { workspace = true }
libm = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "trace"
harness = false
