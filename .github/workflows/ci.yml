name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Validation page matches the tests
        run: cargo run -p xtask -- validation
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test with the parallel feature
        run: cargo test -p tpt-optics-design --features parallel,serde
      - name: Test the serde feature of the geometry crate
        run: cargo test -p tpt-optics-geometric --features serde
      - name: no_std compatibility
        run: |
          cargo build -p tpt-optics-core --no-default-features
          cargo build -p tpt-optics-geometric --no-default-features
          cargo build -p tpt-optics-polarization --no-default-features

  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  no-std-embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Bare-metal build (no std)
        run: |
          for crate in tpt-optics-core tpt-optics-geometric tpt-optics-polarization \
                       tpt-optics-wave tpt-optics-waveguide tpt-optics-design; do
            cargo build -p "$crate" --no-default-features --target thumbv7em-none-eabi
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81
      - uses: Swatinem/rust-cache@v2
      - name: Build on the minimum supported Rust version
        run: cargo build --workspace

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run every example
        # Every file in crates/tpt-optics/examples is run, so a new example is
        # checked without editing this list.
        shell: bash
        run: |
          for f in crates/tpt-optics/examples/*.rs; do
            name=$(basename "$f" .rs)
            echo "::group::example $name"
            cargo run --release -p tpt-optics --example "$name" --features full
            echo "::endgroup::"
          done

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the WebAssembly bindings
        run: cargo build -p tpt-optics-wasm --target wasm32-unknown-unknown

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Python extension (standalone crate)
        run: cargo build --manifest-path crates/tpt-optics-py/Cargo.toml --features extension-module

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: License / source policy
        run: cargo deny check licenses sources
