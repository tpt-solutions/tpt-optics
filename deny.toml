# cargo-deny configuration for tpt-optics.
#
# Dependency license policy (see todo.md / spec.txt):
#   * Every dependency must be MIT-only or dual-licensed MIT OR Apache-2.0.
#   * Crates whose *only* license is Apache-2.0 are forbidden.
#   * Additional permissive licenses are tolerated where they appear as
#     alternatives inside dual expressions or in build-time tooling deps
#     (BSD-2/3-Clause, ISC, Zlib, Unicode-3.0, CC0-1.0, MIT-0).
#
# Implementation note: cargo-deny evaluates *each* license of a license
# expression. An expression such as "MIT OR Apache-2.0" passes as long as at
# least one alternative (here MIT) is allowed and none is explicitly denied.
# A crate licensed "Apache-2.0" alone has no allowed alternative and therefore
# fails automatically. That is exactly the "no Apache-2.0-only crates" rule,
# achieved with a strict allow-list instead of a deny entry (a blanket
# `deny = ["Apache-2.0"]` would also reject every dual MIT OR Apache-2.0
# crate, which the policy explicitly permits).

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # Apache-2.0 is deliberately NOT listed: see the comment block above.
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
